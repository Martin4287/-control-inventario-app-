<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario Offline</title>
    <!-- Enlace al manifiesto de la PWA para el icono y la instalación -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <style>
        /* A simple fade-in animation for collapsible sections */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        /* Ensure number input arrows are always visible on mobile if needed */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button {
            opacity: 1;
        }
    </style>
    <link rel="stylesheet" href="/src/index.css">
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
